<!-- Use Bootstrap's layout. It loads Bootstrap's CSS and JavaScript. -->
{% extends "bootstrap/base.html" %}

<!-- Text shown in the browser tab. -->
{% block title %}Flasky{% endblock %}

<!-- Navigation bar at the top of the page. -->
{% block navbar %}
<div class="navbar navbar-inverse" role="navigation">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle"
             data-toggle="collapse" data-target=".navbar-collapse">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/">Flasky</a>
        </div>
        <div class="navbar-collapse collapse">
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}

<!-- The main area. Other templates fill in page_content. -->
{% block content %}
<div class="container">
    {% block page_content %}{% endblock %}
</div>
{% endblock %}

<!-- Load Moment so the timestamp can be formatted in the browser. -->
{% block scripts %}
{{ super() }}
{{ moment.include_moment() }}
{% endblock %}
